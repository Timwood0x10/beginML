[project]
name = "ai-learning-platform-backend"
version = "0.2.0"
description = "Backend service for the AI Learning Platform — Markdown notes with TF-IDF search, semantic map and related notes (scikit-learn)."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "scikit-learn>=1.6.0",
    "numpy>=2.1.0",
    "python-multipart>=0.0.20",
    "markdown>=3.7",
    "pymdown-extensions>=10.11",
    "pygments>=2.18.0",
    "latex2mathml>=3.81.0",
    "pymupdf>=1.28.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
