server {
    listen 80;
    server_name _;  # Replace with your domain, e.g. aiscope.example.com

    # Frontend static files
    root /opt/aiscope/frontend/dist;
    index index.html;

    # SPA routing – fallback to index.html for non-file requests
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API reverse proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Backend static assets (paper images, etc.)
    location /assets/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_cache_valid 200 7d;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Cache static assets (frontend build artifacts with hash)
    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
